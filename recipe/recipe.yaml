schema_version: 1

context:
  name: wexpect
  version: "4.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/wexpect-${{ version }}.tar.gz
  sha256: de9e739e78ec4d74a39bf8499904dacb6c594007a674fb7e10752c9b131f6522

build:
  number: 6
  skip: unix
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pbr
    - pip
    - python
    - setuptools <82
  run:
    - psutil
    - python
    - pywin32
    - setuptools <82

tests:
  - python:
      imports:
        - wexpect
      pip_check: true

about:
  summary: Windows alternative of pexpect
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/wexpect/
  repository: https://github.com/raczben/wexpect

extra:
  recipe-maintainers:
    - thewchan
